<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectres — Tableau de bord d'oncogénétique</title>
<style>
:root{
  --paper:#F0F2F2; --card:#FFFFFF; --ink:#202426; --ink-soft:#4C5453; --line:#D2D9D6;
  --acc:#0E7A6C; --acc-2:#3AA491; --acc-soft:#E0F0EB; --track:#DAE5E1;
  --blue:#31699C; --blue-soft:#E3EDF6;
  --amber:#7D5104; --amber-soft:#F5EDD8; --amber-ink:#5C3D08;
  --berry:#8A3352; --berry-soft:#F6E4EB;
  --code-bg:#EAEEEC; --hover:#F6F9F8; --mark:#F3E3A8;
  --shadow:0 18px 50px rgba(20,40,35,.25);
  --mono:"Consolas","Menlo","DejaVu Sans Mono",monospace;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --paper:#1B1B1E; --card:#242428; --ink:#EAE8E3; --ink-soft:#A9A7A0; --line:#3C3C42;
  --acc:#E98A3C; --acc-2:#F2AE62; --acc-soft:#3A2D1D; --track:#34312C;
  --blue:#8CC3B5; --blue-soft:#263430;
  --amber:#D9B45B; --amber-soft:#322B17; --amber-ink:#E3CB84;
  --berry:#D993A6; --berry-soft:#342228;
  --code-bg:#2F2F34; --hover:#2B2B30; --mark:#57431D;
  --shadow:0 18px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 44px,color-mix(in srgb,var(--acc) 4%,transparent) 44px,color-mix(in srgb,var(--acc) 4%,transparent) 45px),
             repeating-linear-gradient(90deg,transparent,transparent 44px,color-mix(in srgb,var(--acc) 4%,transparent) 44px,color-mix(in srgb,var(--acc) 4%,transparent) 45px)}
header{position:relative;z-index:2;padding:26px 24px 14px;max-width:1360px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.1}
h1 em{font-style:italic;color:var(--acc)}
.hmeta{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);text-align:right;line-height:1.7}
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1.5px solid var(--line);padding:10px 24px}
.topbar-inner{max-width:1360px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 260px;font-size:1rem;padding:11px 14px;border:2px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:var(--ink-soft);opacity:.75}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--line);background:var(--card);color:var(--ink-soft);padding:9px 15px;border-radius:11px;cursor:pointer;font-size:.92rem;font-weight:600}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
html[data-theme="dark"] .tab.on{color:#1B1B1E}
.tool{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:11px;cursor:pointer;font-size:.9rem;font-weight:600;margin-left:auto}
.tool:hover,.tab:hover{border-color:var(--acc)}
button:focus-visible,#q:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.layout{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:18px 24px 70px;display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.layout.nosb{grid-template-columns:1fr}
aside.sb{position:sticky;top:76px;display:flex;flex-direction:column;gap:18px}
.s-label{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
.catbtn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;color:var(--ink-soft);padding:7px 10px;font-size:.9rem;cursor:pointer;border-radius:0 8px 8px 0}
.catbtn:hover{background:var(--hover);color:var(--ink)}
.catbtn.on{border-left-color:var(--acc);color:var(--acc);font-weight:700;background:var(--acc-soft)}
.catbtn small{color:var(--ink-soft);font-family:var(--mono);font-size:.75rem}
.trbtns{display:flex;flex-wrap:wrap;gap:6px}
.trb{border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:16px;padding:5px 11px;font-size:.8rem;cursor:pointer}
.trb.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft);font-weight:700}
.count{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;display:flex;flex-direction:column;gap:9px}
.gcard:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.gc-cat{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.gc-name{font-family:var(--serif);font-size:1.08rem;line-height:1.3}
.gc-genes{display:flex;flex-wrap:wrap;gap:5px}
.gpill{font-family:var(--mono);font-size:.78rem;font-weight:600;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:2px 8px}
.gpill.more{background:transparent;color:var(--ink-soft)}
.gc-prev{display:flex;flex-direction:column;gap:5px;margin-top:auto}
.gc-row{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;font-size:.8rem;color:var(--ink-soft)}
.gc-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minitrack{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.minibar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc-2));min-width:4px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:9px 16px;cursor:pointer;font-size:.95rem;color:var(--ink)}
.chip small{color:var(--ink-soft);margin-left:6px}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.meta{color:var(--ink-soft);font-size:.85rem;margin:2px 2px 14px}
.pane-title{font-family:var(--serif);font-size:1.55rem;margin:2px 0}
.pane-sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:14px}
.back{background:none;border:none;color:var(--acc);cursor:pointer;font-size:.95rem;font-weight:600;padding:6px 0;margin-bottom:6px}
.empty{color:var(--ink-soft);padding:30px 6px;font-size:.95rem}
.orow{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(120px,1fr) auto;gap:10px;align-items:center}
.orow:hover{border-color:var(--acc)}
.hitgroup{margin:16px 0 6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
/* ── panneau latéral fiche ── */
.overlay{position:fixed;inset:0;background:rgba(10,14,13,.45);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:60}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:var(--card);border-left:2px solid var(--acc);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;z-index:70;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.p-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1.5px solid var(--line)}
.p-eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.p-title{font-family:var(--serif);font-size:1.45rem;line-height:1.25;margin-top:2px}
.p-alias{color:var(--ink-soft);font-size:.83rem;margin-top:3px}
.p-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.p-btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:.85rem}
.p-btn:hover{border-color:var(--acc);color:var(--acc)}
.p-body{overflow-y:auto;padding:14px 20px 30px;flex:1}
.factline{display:flex;flex-wrap:wrap;gap:16px;color:var(--ink-soft);font-size:.88rem;margin-bottom:6px}
.factline b{color:var(--ink);font-weight:700}
.sec{margin:18px 0 0}
.sec-h{font-size:.78rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sec-h::before{content:"";width:20px;height:4px;border-radius:2px;background:currentColor}
.h-spec{color:var(--acc)} .h-gene{color:var(--ink)} .h-var{color:var(--ink)}
.h-crit{color:var(--amber)} .h-surv{color:var(--blue)} .h-ttt{color:var(--berry)} .h-src{color:var(--ink-soft)}
.trow{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(110px,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line);border-radius:8px}
.trow:hover{background:var(--hover)}
.trow:last-child{border-bottom:none}
.tname{font-size:.95rem;font-weight:500}
.tnote{color:var(--ink-soft);font-size:.82rem;display:block;font-weight:400;margin-top:2px}
.torg{font-size:.75rem;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:2px 7px;margin-left:6px;white-space:nowrap;cursor:pointer;display:inline-block}
.torg:hover{text-decoration:underline}
.bartrack{height:13px;background:var(--track);border-radius:7px;overflow:hidden}
.bar{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--acc-2));position:relative;min-width:7px}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 15px);border-radius:7px}
html[data-theme="dark"] .bar::after{background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 6px,transparent 6px 15px)}
.rtxt{font-family:var(--mono);font-size:.85rem;font-weight:700;text-align:right;min-width:100px}
.nobar{font-size:.8rem;color:var(--ink-soft);font-style:italic}
ul.plain{list-style:none}
ul.plain li{padding:5px 0 5px 18px;position:relative;font-size:.92rem}
ul.plain li::before{content:"–";position:absolute;left:2px;color:var(--ink-soft);font-weight:700}
.sec-crit ul.plain li::before{color:var(--amber)} .sec-surv ul.plain li::before{color:var(--blue)} .sec-ttt ul.plain li::before{color:var(--berry)}
.vrow{font-size:.92rem;padding:4px 0}
.vrow code{font-family:var(--mono);font-size:.86rem;background:var(--code-bg);border-radius:6px;padding:2px 7px}
.vrow span,.generow span{color:var(--ink-soft);font-size:.85rem}
.generow{font-size:.92rem;padding:4px 0}
.generow b{font-family:var(--mono);font-weight:700;color:var(--acc)}
.srcs{font-size:.8rem;color:var(--ink-soft)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
footer{position:relative;z-index:1;max-width:1360px;margin:0 auto 40px;padding:0 24px;color:var(--ink-soft);font-size:.78rem}
.dwrap{padding:0 24px}
/* ── poignée de redimensionnement du panneau ── */
.p-resize{position:absolute;left:0;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:5;touch-action:none}
.p-resize::after{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:3px;height:52px;border-radius:2px;background:var(--line)}
.p-resize:hover::after,.panel.resizing .p-resize::after{background:var(--acc)}
.panel.resizing{transition:none;user-select:none}
/* ── diagnostic différentiel ── */
.diag-intro{margin-bottom:14px}
.diag-title{font-family:var(--serif);font-size:1.45rem;margin-bottom:4px}
.diag-sub{color:var(--ink-soft);font-size:.88rem}
.dgroup{margin-bottom:16px}
.dgroup-t{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
.dchips{display:flex;flex-wrap:wrap;gap:7px}
.dchip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:.88rem;cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px}
.dchip::before{content:"";width:13px;height:13px;border:2px solid var(--line);border-radius:4px;flex-shrink:0;background:var(--card)}
.dchip:hover{border-color:var(--acc)}
.dchip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.dchip.on::before{background:var(--acc);border-color:var(--acc)}
.diag-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.diag-count{font-family:var(--mono);font-size:.8rem;color:var(--ink-soft)}
.diag-clear{border:none;background:none;color:var(--acc);cursor:pointer;font-size:.85rem;font-weight:600;text-decoration:underline dotted}
.dres{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px;cursor:pointer}
.dres:hover{border-color:var(--acc)}
.dres-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.dres-name{font-family:var(--serif);font-size:1.1rem}
.dres-score{font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.dres-genes{color:var(--ink-soft);font-size:.8rem;font-family:var(--mono);margin-bottom:6px}
@media (max-width:880px){
  .layout{grid-template-columns:1fr}
  aside.sb{position:static;flex-direction:row;flex-wrap:wrap;gap:14px}
  .sb>div{min-width:180px}
  .hmeta{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.panel,.overlay,.gcard{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">Atlas · Oncogénétique · Prédispositions héréditaires</div>
    <h1>Spectres <em>tumoraux</em></h1>
  </div>
  <div class="hmeta" id="hmeta"></div>
</header>
<div class="topbar">
  <div class="topbar-inner">
    <input id="q" type="search" autocomplete="off" placeholder="Rechercher : syndrome, gène, organe, tumeur…  [touche /]" aria-label="Recherche">
    <div class="tabs" role="tablist">
      <button class="tab on" data-mode="syn" role="tab">Syndromes</button>

    <button class="tool" id="t-theme" title="Mode sombre / clair">◐</button>

</div>
<div class="layout" id="layout">
  <aside class="sb" id="side"></aside>
  <section id="content"></section>
</div>
<footer>Sources principales : GeneReviews · NCCN Genetic/Familial High-Risk Assessment · PLSD (Dominguez-Valentin 2020) · Kuchenbaecker JAMA 2017 · GGC-Unicancer, ERN GENTURIS, ATA 2015 (MEN2), IGCLC 2020 (CDH1), C4CMMRD.</footer>
<div class="overlay" id="overlay"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Fiche syndrome"></div>

genes:[["ELP1","complexe Elongator ; médulloblastomes SHH exclusivement, souvent avec perte 9q et mutation PTCH1 somatique"]],
sp:[["Médulloblastome SHH de l'enfant",["Cerveau / SNC"],"pénétrance mal connue (faible à modérée)",null,"y penser dans tout médulloblastome SHH pédiatrique"]],
va:[],
cr:["Médulloblastome SHH de l'enfant → panel germinal incluant ELP1, PTCH1, SUFU, TP53 (recommandation croissante)"],
su:["Pas de protocole consensuel (données récentes) ; information familiale"],
tt:["Traitement standard du médulloblastome ; l'identification germinale modifie surtout le conseil familial"],
src:["Waszak, Nature 2020","Recommandations SIOPE germline"]}
];
/* ---------- utilitaires ---------- */
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const content=document.getElementById("content");
const side=document.getElementById("side");
const layout=document.getElementById("layout");
const qInput=document.getElementById("q");
const overlay=document.getElementById("overlay");
const panel=document.getElementById("panel");
let mode="syn", query="", cat=null, trF=null, orgSel=null, genSel=null, panelId=null;

function hi(text){
  const q=norm(query);
  if(!q) return esc(text);
  const n=norm(text); let out="",i=0;
  while(true){
    const j=n.indexOf(q,i);
    if(j===-1){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,j))+"<mark>"+esc(text.slice(j,j+q.length))+"</mark>";
    i=j+q.length;
  }
  return out;
}

/* thème */
const root=document.documentElement;
function pget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function pset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let theme=pget("sp-theme");
if(!theme) theme=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
function applyTheme(){if(theme==="dark")root.dataset.theme="dark"; else delete root.dataset.theme;}
applyTheme();
document.getElementById("t-theme").addEventListener("click",()=>{theme=(theme==="dark")?"light":"dark";pset("sp-theme",theme);applyTheme();});

/* ---------- index ---------- */
const ORGS={}; const GENES={};
DATA.forEach(d=>{
  d.sp.forEach(t=>{(t[1]||[]).forEach(o=>{(ORGS[o]=ORGS[o]||[]).push({id:d.id,nom:d.nom,t:t[0],r:t[2],rv:t[3],note:t[4]||""});});});
  d.genes.forEach(g=>{const key=g[0].split(" ")[0]; (GENES[key]=GENES[key]||new Set()).add(d.id);});
});
const ORG_LIST=Object.keys(ORGS).sort((a,b)=>a.localeCompare(b,"fr"));
const GENE_LIST=Object.keys(GENES).sort();
document.getElementById("hmeta").innerHTML=DATA.length+" syndromes<br>"+GENE_LIST.length+" gènes · "+ORG_LIST.length+" organes";

const TRS=[["AD","AD"],["AR","AR"],["X","Lié à l'X"],["emp","Empreinte"]];
function trMatch(d,k){
  const t=d.tr;
  if(k==="AD") return /\bAD\b/.test(t);
  if(k==="AR") return /\bAR\b/.test(t);
  if(k==="X") return /à l'X/i.test(t);
  if(k==="emp") return /empreinte/i.test(t);
  return true;
}
function synMatches(d,q){
  if(!q) return true;
  if(norm(d.nom).includes(q)) return true;
  if(d.al.some(a=>norm(a).includes(q))) return true;
  if(d.genes.some(g=>norm(g[0]).includes(q))) return true;
  if(d.sp.some(t=>norm(t[0]).includes(q)||(t[1]||[]).some(o=>norm(o).includes(q)))) return true;
  if(d.va.some(v=>norm(v[0]).includes(q))) return true;
  return false;
}
function filtered(){
  const q=norm(query);
  return DATA.filter(d=>synMatches(d,q)&&(!cat||d.cat===cat)&&(!trF||trMatch(d,trF)));
}

/* ---------- panneau fiche ---------- */
function bar(t){
  const orgs=(t[1]||[]).map(o=>'<span class="torg" data-org="'+esc(o)+'">'+esc(o)+"</span>").join("");
  const note=t[4]?'<span class="tnote">'+esc(t[4])+'</span>':"";
  const b=(t[3]==null)?'<span class="nobar">non quantifié / voir texte</span>'
    :'<div class="bartrack"><div class="bar" style="width:'+Math.max(2,Math.min(100,t[3]))+'%"></div></div>';
  return '<div class="trow"><div class="tname">'+esc(t[0])+orgs+note+'</div>'+b+'<div class="rtxt">'+esc(t[2])+"</div></div>";
}
function section(cls,titleCls,title,inner){
  return inner?'<div class="sec '+cls+'"><div class="sec-h '+titleCls+'">'+title+"</div>"+inner+"</div>":"";
}
function fiche(d){
  const sp=[...d.sp].sort((a,b)=>(b[3]??-1)-(a[3]??-1)).map(bar).join("");
  const genes=d.genes.map(g=>'<div class="generow"><b>'+esc(g[0])+"</b>"+(g[1]?' — <span>'+esc(g[1])+"</span>":"")+"</div>").join("");
  const va=d.va.map(v=>'<div class="vrow"><code>'+esc(v[0])+"</code>"+(v[1]?" <span>— "+esc(v[1])+"</span>":"")+"</div>").join("");
  const list=a=>a&&a.length?'<ul class="plain">'+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"";
  return '<div class="p-head"><div>'
    +'<div class="p-eyebrow">'+esc(CATS[d.cat])+'</div>'
    +'<div class="p-title">'+esc(d.nom)+'</div>'
    +(d.al.length?'<div class="p-alias">'+esc(d.al.join(" · "))+'</div>':"")
    +'</div><div class="p-actions">'
    +'<button class="p-btn" id="p-close" aria-label="Fermer">✕</button>'
    +"</div></div>"
    +'<div class="p-body">'
    +'<div class="factline"><span>Transmission : <b>'+esc(d.tr)+"</b></span><span>Fréquence : <b>"+esc(d.pre)+"</b></span></div>"
    +section("","h-spec","Spectre tumoral — du plus fréquent au plus rare",sp)
    +section("","h-gene","Gènes",genes)
    +section("","h-var","Variants récurrents / fondateurs",va)
    +section("sec-crit","h-crit","Critères d'indication du test",list(d.cr))
    +section("sec-surv","h-surv","Surveillance",list(d.su))
    +section("sec-ttt","h-ttt","Implications thérapeutiques",list(d.tt))
    +section("","h-src","Sources",'<div class="srcs">'+d.src.map(esc).join(" · ")+"</div>")
    +"</div>";
}
function panelWidth(){let w=parseInt(pget("sp-pw")||"620",10); if(isNaN(w))w=620; return Math.max(380,Math.min(w,Math.round(window.innerWidth*0.95)));}
function openPanel(id){
  const d=DATA.find(x=>x.id===id); if(!d) return;
  panelId=id;
  panel.innerHTML='<div class="p-resize" title="Glisser pour redimensionner (double-clic : réinitialiser)"></div>'+fiche(d);
  panel.style.width=panelWidth()+"px";
  panel.classList.add("open"); overlay.classList.add("open");
  document.body.style.overflow="hidden";
  panel.scrollTop=0; const pb=panel.querySelector(".p-body"); if(pb) pb.scrollTop=0;
  document.getElementById("p-close").addEventListener("click",closePanel);
  panel.querySelectorAll("[data-org]").forEach(el=>el.addEventListener("click",()=>{
    closePanel(); mode="org"; orgSel=el.dataset.org; syncTabs(); render(); window.scrollTo({top:0});
  }));
}
function closePanel(){panelId=null;panel.classList.remove("open");overlay.classList.remove("open");document.body.style.overflow="";}
overlay.addEventListener("click",closePanel);
/* redimensionnement du panneau par sa bordure gauche */
let rsz=null;
panel.addEventListener("pointerdown",e=>{
  const h=e.target.closest(".p-resize"); if(!h) return;
  rsz={px:e.clientX,w:panel.getBoundingClientRect().width};
  panel.classList.add("resizing");
  h.setPointerCapture(e.pointerId);
  e.preventDefault();
});
panel.addEventListener("pointermove",e=>{
  if(!rsz) return;
  const w=Math.max(380,Math.min(rsz.w+(rsz.px-e.clientX),Math.round(window.innerWidth*0.95)));
  panel.style.width=w+"px";
});
function endResize(){
  if(!rsz) return;
  rsz=null; panel.classList.remove("resizing");
  pset("sp-pw",String(Math.round(panel.getBoundingClientRect().width)));
}
panel.addEventListener("pointerup",endResize);
panel.addEventListener("pointercancel",endResize);
panel.addEventListener("dblclick",e=>{
  if(!e.target.closest(".p-resize")) return;
  panel.style.width="620px"; pset("sp-pw","620");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&panelId) closePanel();
  if(e.key==="/"&&document.activeElement!==qInput){e.preventDefault();qInput.focus();qInput.select();}
});

/* ---------- diagnostic différentiel ---------- */
const DIAG_GROUPS=[
["Digestif & pancréas",["Côlon-rectum","Estomac","Intestin grêle / duodénum","Pancréas","Foie / voies biliaires"]],
["Sein & gynécologie",["Sein","Ovaire","Endomètre / utérus","Col utérin"]],
["Rein & urologie",["Rein","Voies urinaires / vessie","Prostate","Testicule"]],
["Endocrinien",["Thyroïde","Parathyroïdes","Hypophyse","Surrénale (cortex)","Phéochromocytome / paragangliome","Thymus"]],
["Peau & œil",["Peau","Œil"]],
["SNC & ORL",["Cerveau / SNC","ORL / tête et cou"]],
["Thorax",["Poumon / plèvre","Cœur"]],
["Hématologie",["Sang / moelle"]],
["Os & tissus mous",["Os","Tissus mous / sarcomes"]]];
let diagSel=new Set();
function viewDiag(){
  side.style.display="none"; layout.classList.add("nosb");
  const q=norm(query);
  const grouped=new Set(); DIAG_GROUPS.forEach(g=>g[1].forEach(o=>grouped.add(o)));
  const rest=ORG_LIST.filter(o=>!grouped.has(o));
  const groups=rest.length?DIAG_GROUPS.concat([["Autres",rest]]):DIAG_GROUPS;
  let html='<div class="diag-intro"><div class="diag-title">Diagnostic différentiel</div>'
    +'<div class="diag-sub">Cocher la ou les localisations tumorales observées chez le patient ou dans la famille : les syndromes compatibles s\u2019affichent, classés par nombre de localisations couvertes puis par niveau de risque.</div></div>';
  groups.forEach(gr=>{
    const t=gr[0], orgs=gr[1];
    const os=orgs.filter(o=>ORGS[o]&&(!q||norm(o).includes(q)||diagSel.has(o)));
    if(!os.length) return;
    html+='<div class="dgroup"><div class="dgroup-t">'+esc(t)+'</div><div class="dchips">'
      +os.map(o=>'<span class="dchip'+(diagSel.has(o)?" on":"")+'" tabindex="0" role="checkbox" aria-checked="'+diagSel.has(o)+'" data-diag="'+esc(o)+'">'+esc(o)+"</span>").join("")
      +"</div></div>";
  });
  html+='<div class="diag-bar"><span class="diag-count">'+diagSel.size+" localisation(s) sélectionnée(s)</span>"
    +(diagSel.size?'<button class="diag-clear" data-diag-clear>Tout effacer</button>':"")+"</div>";
  if(diagSel.size){
    const res=DATA.map(d=>{
      const rows=d.sp.filter(t=>(t[1]||[]).some(o=>diagSel.has(o)));
      const orgsHit=new Set(); rows.forEach(t=>(t[1]||[]).forEach(o=>{if(diagSel.has(o))orgsHit.add(o);}));
      const maxrv=rows.reduce((m,t)=>Math.max(m,t[3]??0),0);
      return {d:d,rows:rows,n:orgsHit.size,maxrv:maxrv};
    }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||b.maxrv-a.maxrv);
    html+='<div class="hitgroup">'+res.length+" syndrome(s) compatible(s)</div>";
    html+=res.map(x=>{
      const rows=[...x.rows].sort((a,b)=>(b[3]??-1)-(a[3]??-1)).map(bar).join("");
      const genes=x.d.genes.slice(0,5).map(g=>g[0].split(" ")[0]).join(" · ");
      return '<div class="dres" data-open="'+x.d.id+'" tabindex="0" role="button">'
        +'<div class="dres-head"><span class="dres-name">'+esc(x.d.nom)+'</span>'
        +'<span class="dres-score">'+x.n+"/"+diagSel.size+" localisation(s)</span></div>"
        +'<div class="dres-genes">'+esc(genes)+"</div>"+rows+"</div>";
    }).join("")||'<div class="empty">Aucun syndrome ne couvre ces localisations.</div>';
  } else {
    html+='<div class="empty">Exemple : cocher « Estomac » + « Sein » fait remonter CDH1 (gastrique diffus + lobulaire) devant Lynch, Peutz-Jeghers, Li-Fraumeni…</div>';
  }
  content.innerHTML=html;
}

/* ---------- barre latérale ---------- */
function renderSide(){
  const counts={};
  DATA.forEach(d=>counts[d.cat]=(counts[d.cat]||0)+1);
  let html='<div><div class="s-label">Catégories</div>';
  html+='<button class="catbtn'+(cat===null?" on":"")+'" data-cat="">Toutes <small>'+DATA.length+"</small></button>";
  Object.keys(CATS).forEach(c=>{
    html+='<button class="catbtn'+(cat===c?" on":"")+'" data-cat="'+c+'">'+CATS[c]+" <small>"+(counts[c]||0)+"</small></button>";
  });
  html+="</div>";
  html+='<div><div class="s-label">Transmission</div><div class="trbtns">';
  TRS.forEach(([k,lab])=>{html+='<button class="trb'+(trF===k?" on":"")+'" data-tr="'+k+'">'+lab+"</button>";});
  html+="</div></div>";
  html+='<div class="count" id="count"></div>';
  side.innerHTML=html;
  side.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.cat||null;render();}));
  side.querySelectorAll("[data-tr]").forEach(b=>b.addEventListener("click",()=>{trF=(trF===b.dataset.tr)?null:b.dataset.tr;render();}));
}

/* ---------- vues ---------- */
function miniCard(d){
  const pills=d.genes.slice(0,3).map(g=>'<span class="gpill">'+hi(g[0].split(" ")[0])+"</span>").join("")
    +(d.genes.length>3?'<span class="gpill more">+'+(d.genes.length-3)+"</span>":"");
  const top=[...d.sp].sort((a,b)=>(b[3]??-1)-(a[3]??-1)).slice(0,3).map(t=>{
    const b=(t[3]==null)?'<div class="minitrack"></div>':'<div class="minitrack"><div class="minibar" style="width:'+Math.max(3,Math.min(100,t[3]))+'%"></div></div>';
    return '<div class="gc-row"><span class="nm">'+esc(t[0])+"</span>"+b+"</div>";
  }).join("");
  return '<div class="gcard" data-open="'+d.id+'" tabindex="0" role="button" aria-label="Ouvrir la fiche '+esc(d.nom)+'">'
    +'<div class="gc-cat">'+esc(CATS[d.cat])+'</div>'
    +'<div class="gc-name">'+hi(d.nom)+'</div>'
    +'<div class="gc-genes">'+pills+"</div>"
    +'<div class="gc-prev">'+top+"</div></div>";
}
function viewSyn(){
  layout.classList.remove("nosb");
  side.style.display="";
  renderSide();
  const ds=filtered();
  const q=norm(query);
  let extra="";
  if(q){
    const gHits=GENE_LIST.filter(g=>norm(g).includes(q));
    const oHits=ORG_LIST.filter(o=>norm(o).includes(q));
    if(oHits.length) extra+='<div class="hitgroup">Organes correspondants</div><div class="chips" style="margin-bottom:10px">'+oHits.map(o=>'<span class="chip" tabindex="0" data-org-go="'+esc(o)+'">'+esc(o)+"<small>"+ORGS[o].length+"</small></span>").join("")+"</div>";
    if(gHits.length) extra+='<div class="hitgroup">Gènes correspondants</div><div class="chips" style="margin-bottom:10px">'+gHits.map(g=>'<span class="chip" tabindex="0" data-gene-go="'+esc(g)+'">'+esc(g)+"<small>"+GENES[g].size+"</small></span>").join("")+"</div>";
  }
  content.innerHTML=extra+'<div class="grid">'+(ds.map(miniCard).join("")||'<div class="empty">Aucune fiche ne correspond aux filtres.</div>')+"</div>";
  const c=document.getElementById("count");
  if(c) c.textContent=ds.length+" / "+DATA.length+" fiches affichées";
}
function viewOrg(){
  side.style.display="none"; layout.classList.add("nosb");
  const q=norm(query);
  if(!orgSel){
    const list=ORG_LIST.filter(o=>!q||norm(o).includes(q));
    content.innerHTML='<div class="meta">Choisir un organe : toutes les tumeurs héréditaires le concernant, tous syndromes confondus, triées par risque.</div><div class="chips">'
      +list.map(o=>'<span class="chip" tabindex="0" data-org-go="'+esc(o)+'">'+esc(o)+"<small>"+ORGS[o].length+"</small></span>").join("")
      +(list.length?"":'<div class="empty">Aucun organe ne correspond.</div>')+"</div>";
    return;
  }
  const rows=[...ORGS[orgSel]].sort((a,b)=>(b.rv??-1)-(a.rv??-1));
  content.innerHTML='<button class="back" data-back="org">← Tous les organes</button>'
    +'<div class="pane-title">'+esc(orgSel)+'</div><div class="pane-sub">'+rows.length+' entrées — cliquer une ligne pour ouvrir la fiche du syndrome.</div>'
    +rows.map(r=>{
      const b=(r.rv==null)?'<span class="nobar">non quantifié</span>':'<div class="bartrack"><div class="bar" style="width:'+Math.max(2,Math.min(100,r.rv))+'%"></div></div>';
      return '<div class="orow" data-open="'+r.id+'" tabindex="0" role="button"><div class="tname">'+esc(r.t)
        +'<span class="tnote">'+(r.note?esc(r.note)+" — ":"")+esc(r.nom)+"</span></div>"+b+'<div class="rtxt">'+esc(r.r)+"</div></div>";
    }).join("");
}
function viewGen(){
  side.style.display="none"; layout.classList.add("nosb");
  const q=norm(query);
  if(!genSel){
    const list=GENE_LIST.filter(g=>!q||norm(g).includes(q));
    content.innerHTML='<div class="meta">Du gène vers le spectre : choisir un gène.</div><div class="chips">'
      +list.map(g=>'<span class="chip" tabindex="0" data-gene-go="'+esc(g)+'"><b style="font-family:var(--mono)">'+esc(g)+"</b><small>"+GENES[g].size+"</small></span>").join("")
      +(list.length?"":'<div class="empty">Aucun gène ne correspond.</div>')+"</div>";
    return;
  }
  const ds=DATA.filter(d=>GENES[genSel]&&GENES[genSel].has(d.id));
  content.innerHTML='<button class="back" data-back="gen">← Tous les gènes</button>'
    +'<div class="pane-title" style="font-family:var(--mono)">'+esc(genSel)+'</div><div class="pane-sub">'+ds.length+" syndrome(s) associé(s) — cliquer pour ouvrir la fiche.</div>"
    +'<div class="grid">'+ds.map(miniCard).join("")+"</div>";
}

/* ---------- navigation ---------- */
function render(){
  if(mode==="syn") viewSyn();
  else if(mode==="org") viewOrg();
  else if(mode==="diag") viewDiag();
  else viewGen();
}
function syncTabs(){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.mode===mode));}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  mode=b.dataset.mode; orgSel=null; genSel=null; syncTabs(); render();
}));
qInput.addEventListener("input",()=>{query=qInput.value.trim(); if(mode==="org")orgSel=null; if(mode==="gen")genSel=null; render();});
document.addEventListener("click",e=>{
  const dc=e.target.closest("[data-diag]");
  if(dc){const o=dc.dataset.diag; diagSel.has(o)?diagSel.delete(o):diagSel.add(o); render(); return;}
  if(e.target.closest("[data-diag-clear]")){diagSel.clear(); render(); return;}
  const open=e.target.closest("[data-open]");
  if(open){openPanel(open.dataset.open); return;}
  const og=e.target.closest("[data-org-go]");
  if(og){mode="org"; orgSel=og.dataset.orgGo; syncTabs(); render(); window.scrollTo({top:0}); return;}
  const gg=e.target.closest("[data-gene-go]");
  if(gg){mode="gen"; genSel=gg.dataset.geneGo; syncTabs(); render(); window.scrollTo({top:0}); return;}
  const back=e.target.closest("[data-back]");
  if(back){if(back.dataset.back==="org")orgSel=null; else genSel=null; render(); return;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){
    const t=e.target.closest&&e.target.closest("[data-open],[data-org-go],[data-gene-go],[data-diag]");
    if(t){e.preventDefault(); t.click();}
  }
});
render();
</script>
</body>
</html>
